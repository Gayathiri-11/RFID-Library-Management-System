
<!DOCTYPE html>
<html>
<head>
    <title>Return Book</title>

    <style>
        body{
            font-family: Arial;
            background:#f4f6f9;
            text-align:center;
        }

        .container{
            width:400px;
            margin:50px auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px;
        }

        button{
            padding:10px 20px;
            background:#dc3545;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#b52a37;
        }

        /* TOAST */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #28a745;
            color: white;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
        }

        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2s;
        }

        @keyframes fadein {
            from {bottom: 0; opacity: 0;}
            to {bottom: 30px; opacity: 1;}
        }

        @keyframes fadeout {
            from {bottom: 30px; opacity: 1;}
            to {bottom: 0; opacity: 0;}
        }
    </style>
</head>

<body>

{% include 'sidebar.html' %}

<div class="container">

    <h1>Return Book</h1>

    <form method="POST">

        <p><b>Book UID</b></p>

        <input
            type="text"
            id="uid"
            name="uid"
            placeholder="Scan RFID Tag"
            required
        >

        <br>

        <button
            type="button"
            onclick="scanRFID()">
            Scan RFID
        </button>

        <p><b>Student Roll Number</b></p>

        <input
            type="text"
            name="roll_number"
            placeholder="Enter Roll Number"
            required
        >

        <br><br>

        <button type="submit">
            Return Book
        </button>

    </form>

</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
function showToast(message, redirectUrl=null) {
    var toast = document.getElementById("toast");
    toast.innerText = message;
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");

        if (redirectUrl) {
            window.location.href = redirectUrl;
        }

    }, 2000);
}
</script>

{% if message %}
<script>
    showToast("{{ message }}", "{{ redirect }}");
</script>
{% endif %}

</body>
</html>
