<!DOCTYPE html>

<html>
<head>
    <title>Replace RFID Tag</title>


<style>

    body{
        font-family: Arial, sans-serif;
        background:#f4f6f9;
        margin:0;
        padding:0;
    }

    .container{
        width:450px;
        margin:50px auto;
        background:white;
        padding:30px;
        border-radius:10px;
        box-shadow:0px 0px 10px lightgray;
    }

    h2{
        text-align:center;
        color:#003366;
    }

    label{
        font-weight:bold;
    }

    input{
        width:100%;
        padding:10px;
        margin-top:5px;
        margin-bottom:15px;
        border:1px solid #ccc;
        border-radius:5px;
    }

    .old-uid{
        background:#f1f1f1;
        padding:10px;
        border-radius:5px;
        margin-bottom:15px;
        font-weight:bold;
        color:#003366;
    }

    button{
        width:100%;
        padding:12px;
        background:#0066cc;
        color:white;
        border:none;
        border-radius:5px;
        cursor:pointer;
        font-size:16px;
    }

    button:hover{
        background:#004c99;
    }

    .warning{
        color:red;
        text-align:center;
        margin-bottom:15px;
        font-weight:bold;
    }

</style>


</head>

<body>

{% include 'sidebar.html' %}

<div class="container">


<h2>Replace RFID Tag</h2>

<p class="warning">
    Use this only when an RFID tag is lost or damaged.
</p>

<div class="old-uid">
    Current UID: {{ old_uid }}
</div>

<form method="POST">

    <label>New RFID UID</label>

    <input
        type="text"
        name="new_uid"
        placeholder="Scan or enter new RFID UID"
        required
    >

    <button type="submit">
        Replace RFID Tag
    </button>

</form>

</div>

</body>
</html>
