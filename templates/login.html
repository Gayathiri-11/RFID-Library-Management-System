<!DOCTYPE html>
<html>
<head>
    <title>RFID Library Login</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
        }

        .login-box{
            width:350px;
            margin:100px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0px 0px 10px lightgray;
        }

        h1{
            text-align:center;
            color:#003366;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:5px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            background:#0066cc;
            color:white;
            padding:12px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#004d99;
        }

    </style>
</head>

<body>

<div class="login-box">

    <h1>RFID Library</h1>

    <form method="POST">

        <label>Username</label>
        <input
            type="text"
            name="username"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>
</html>
