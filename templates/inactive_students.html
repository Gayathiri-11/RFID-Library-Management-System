<!DOCTYPE html>
<html>
<head>
    <title>Deactivated Students</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f6f9;
            margin:0;
            padding:0;
        }

        .container{
          margin-left:240px;
         padding:20px;
        }

        h1{
            text-align:center;
            color:#003366;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th{
            background:#003366;
            color:white;
            padding:12px;
        }

        td{
            padding:10px;
            border-bottom:1px solid #ddd;
            text-align:center;
        }

        tr:hover{
            background:#f2f2f2;
        }

    </style>

</head>
<body>

{% include 'sidebar.html' %}

<div class="container">

    <h1>Deactivated Students</h1>

    <table>

        <tr>
            <th>Roll Number</th>
            <th>Student Name</th>
            <th>Department</th>
            <th>Year</th>
            <th>Status</th>
        </tr>

        {% for student in students %}

        <tr>
            <td>{{ student.roll_number }}</td>
            <td>{{ student.student_name }}</td>
            <td>{{ student.department }}</td>
            <td>{{ student.year }}</td>
            <td>{{ student.status }}</td>
        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
